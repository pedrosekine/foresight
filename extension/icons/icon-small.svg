<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The same mark for 16 and 32px: three lines, since six melt into
       grey at that size. -->
  <rect width="32" height="32" rx="6" fill="#f0eee9"/>
  <g fill="#2b2c30">
    <rect x="5" y="8" width="22" height="1.6" rx="0.8"/>
    <rect x="5" y="15.2" width="22" height="1.6" rx="0.8"/>
    <rect x="5" y="22.4" width="22" height="1.6" rx="0.8"/>
  </g>
  <rect x="15" y="12.5" width="11" height="7" fill="#295a68"/>
</svg>
